<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edge TTS Player</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #111111;
    --muted: #6b7280;
    --card: #f4f4f5;
    --border: #e5e7eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0a0a;
      --fg: #f4f4f5;
      --muted: #9ca3af;
      --card: #18181b;
      --border: #27272a;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    color: var(--fg);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    min-height: 80px;
  }
  .player {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 14px 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin: 8px;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }
  .voice { font-weight: 600; font-size: 13px; }
  .meta { font-size: 12px; color: var(--muted); }
  audio { width: 100%; height: 40px; }
  .text {
    font-size: 13px;
    line-height: 1.5;
    color: var(--fg);
    max-height: 140px;
    overflow-y: auto;
    padding: 8px 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .empty { color: var(--muted); font-style: italic; }
  .err {
    color: #dc2626;
    font-size: 12px;
    padding: 6px 10px;
    background: rgba(220, 38, 38, 0.08);
    border-radius: 6px;
  }
</style>
</head>
<body>
<div class="player">
  <div class="row">
    <div id="voice" class="voice">Edge TTS</div>
    <div id="meta" class="meta">ready</div>
  </div>
  <audio id="audio" controls preload="auto"></audio>
  <div id="text" class="text empty">Audio will appear here when speak() is called.</div>
  <div id="err" class="err" hidden></div>
</div>

<script>
"use strict";

(function () {
  var PROTOCOL_VERSION = "2026-01-26";
  var pending = new Map();
  var nextId = 1;

  var audioEl = document.getElementById("audio");
  var voiceEl = document.getElementById("voice");
  var metaEl = document.getElementById("meta");
  var textEl = document.getElementById("text");
  var errEl = document.getElementById("err");

  function showError(msg) {
    errEl.textContent = String(msg);
    errEl.hidden = false;
    sendSize();
  }

  function send(msg) {
    try { window.parent.postMessage(msg, "*"); } catch (e) {}
  }

  function request(method, params) {
    return new Promise(function (resolve, reject) {
      var id = nextId++;
      pending.set(id, { resolve: resolve, reject: reject });
      send({ jsonrpc: "2.0", id: id, method: method, params: params });
      setTimeout(function () {
        if (pending.has(id)) {
          pending.delete(id);
          reject(new Error("timeout: " + method));
        }
      }, 8000);
    });
  }

  function notify(method, params) {
    send({ jsonrpc: "2.0", method: method, params: params || {} });
  }

  window.addEventListener("message", function (e) {
    var msg = e.data;
    if (!msg || msg.jsonrpc !== "2.0") return;

    if (typeof msg.id !== "undefined" && (typeof msg.result !== "undefined" || msg.error)) {
      var p = pending.get(msg.id);
      if (p) {
        pending.delete(msg.id);
        if (msg.error) p.reject(new Error(msg.error.message || JSON.stringify(msg.error)));
        else p.resolve(msg.result);
      }
      return;
    }

    if (msg.method === "ui/notifications/tool-result") {
      handleToolResult(msg.params);
    }
    // Other notifications (host-context-changed etc) — ignore for now
  });

  function pickMeta(obj) {
    if (!obj || typeof obj !== "object") return null;
    return obj._meta || obj.meta || null;
  }

  function fromMeta(m) {
    if (!m || typeof m !== "object") return null;
    if (!m.audio_base64) return null;
    return {
      base64: m.audio_base64,
      mime: m.mime_type || "audio/mpeg",
      voice: m.voice,
      text: m.text,
      rate: m.rate,
      pitch: m.pitch,
      size: m.size_bytes,
    };
  }

  function findAudio(toolResult) {
    if (!toolResult) return null;
    // 1) Look at content blocks for _meta or meta with audio
    var content = toolResult.content;
    if (Array.isArray(content)) {
      for (var i = 0; i < content.length; i++) {
        var b = content[i];
        var fromContentMeta = fromMeta(pickMeta(b));
        if (fromContentMeta) return fromContentMeta;
        if (b && b.type === "audio" && b.data) {
          return { base64: b.data, mime: b.mimeType || "audio/mpeg" };
        }
      }
    }
    // 2) Result-level _meta or meta
    var rmeta = fromMeta(pickMeta(toolResult));
    if (rmeta) return rmeta;
    // 3) structuredContent.result[*]._meta
    var sc = toolResult.structuredContent;
    if (sc && Array.isArray(sc.result)) {
      for (var j = 0; j < sc.result.length; j++) {
        var fromStruct = fromMeta(pickMeta(sc.result[j]));
        if (fromStruct) return fromStruct;
      }
    }
    return null;
  }

  function summarizeShape(v, depth) {
    if (depth === undefined) depth = 0;
    if (v === null) return "null";
    if (Array.isArray(v)) {
      if (depth > 2) return "[...]";
      return "[" + v.slice(0, 3).map(function (x) { return summarizeShape(x, depth + 1); }).join(", ") + (v.length > 3 ? ", ..." : "") + "]";
    }
    if (typeof v === "object") {
      if (depth > 2) return "{...}";
      var keys = Object.keys(v);
      return "{" + keys.slice(0, 8).map(function (k) {
        var val = v[k];
        var t = Array.isArray(val) ? "Array(" + val.length + ")" :
                typeof val === "string" ? "String(" + val.length + ")" :
                typeof val === "object" && val !== null ? summarizeShape(val, depth + 1) :
                String(val);
        return k + ":" + t;
      }).join(", ") + (keys.length > 8 ? ", ..." : "") + "}";
    }
    if (typeof v === "string") return "String(" + v.length + ")";
    return String(v);
  }

  function handleToolResult(params) {
    try {
      var info = findAudio(params);
      if (!info) {
        showError("No audio data in tool result. Shape: " + summarizeShape(params));
        return;
      }
      var binary = atob(info.base64);
      var bytes = new Uint8Array(binary.length);
      for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      var blob = new Blob([bytes], { type: info.mime });
      audioEl.src = URL.createObjectURL(blob);

      voiceEl.textContent = info.voice || "Edge TTS";
      var pieces = [];
      if (info.size) pieces.push((info.size / 1024).toFixed(0) + " KB");
      if (info.rate && info.rate !== "+0%") pieces.push(info.rate);
      if (info.pitch && info.pitch !== "+0Hz") pieces.push(info.pitch);
      metaEl.textContent = pieces.length ? pieces.join(" · ") : "ready";

      if (info.text) {
        textEl.textContent = info.text;
        textEl.classList.remove("empty");
      }

      audioEl.play().catch(function () {
        metaEl.textContent = (metaEl.textContent || "") + " · click ▶";
      });
      sendSize();
    } catch (err) {
      showError("Playback error: " + (err && err.message ? err.message : err));
    }
  }

  var lastW = 0, lastH = 0, scheduled = false;
  function sendSize() {
    if (scheduled) return;
    scheduled = true;
    requestAnimationFrame(function () {
      scheduled = false;
      var de = document.documentElement;
      var prev = de.style.height;
      de.style.height = "max-content";
      var h = Math.ceil(de.getBoundingClientRect().height);
      de.style.height = prev;
      var w = Math.ceil(window.innerWidth);
      if (w === lastW && h === lastH) return;
      lastW = w; lastH = h;
      notify("ui/notifications/size-changed", { width: w, height: h });
    });
  }

  // Initialize handshake
  (async function () {
    try {
      await request("ui/initialize", {
        appInfo: { name: "Edge TTS Player", version: "1.0.0" },
        appCapabilities: {},
        protocolVersion: PROTOCOL_VERSION,
      });
      notify("ui/notifications/initialized", {});
      sendSize();
      try {
        var ro = new ResizeObserver(sendSize);
        ro.observe(document.documentElement);
        ro.observe(document.body);
      } catch (_) {}
    } catch (err) {
      showError("Init failed: " + (err && err.message ? err.message : err));
    }
  })();
})();
</script>
</body>
</html>
